name: Release

# 发布：在 GitHub Actions 里构建，把产物（out/）推到 main 分支。
#
# 分支职责：
#   edit —— 源码 + 文章（默认分支）。日常写作、Pages CMS 的零碎提交都在这里，
#           没有任何 CI 监听，随便提交。
#   main —— 含 dist/ 构建产物 + wrangler.jsonc。
#           Wrangler / Cloudflare Workers 通过 wrangler.jsonc 取 dist/ 发布。
#
# CDN 侧需配置为：分支 main、构建命令留空、输出目录为根目录。
#
# 不再需要 RELEASE_TOKEN：那是为了让推送 main 能触发另一个 GitHub workflow，
# 现在构建就在本 workflow 内完成，CDN 是靠 webhook 感知推送的，
# 不受「GITHUB_TOKEN 推送不触发 workflow」这条限制影响。

on:
  workflow_dispatch:
    inputs:
      # 必须声明：Pages CMS 侧边栏按钮触发时会无条件带上 payload 输入
      #（见其 actions API 里的 createWorkflowDispatch 调用），
      # 未声明的输入会被 GitHub 拒绝并返回 422 Unexpected inputs provided。
      # 本 workflow 用不到它的内容。
      payload:
        description: Pages CMS 传入的上下文（未使用）
        required: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          # source.config.ts 里 lastModifiedTime: "git"，需要提交历史算更新时间
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build 脚本 = fumadocs-mdx && next build
      # next.config.ts 里 output: "export"，产物落在 out/
      - run: pnpm build

      - name: 检查产物
        run: |
          test -f out/index.html || { echo "out/index.html 缺失，产物异常"; exit 1; }
          echo "文件数: $(find out -type f | wc -l)"
          echo "体积:   $(du -sh out | cut -f1)"

      - name: 推送产物到 main（dist/ 子目录 + wrangler.jsonc）
        env:
          TOKEN: ${{ github.token }}
        run: |
          WORKDIR="$(mktemp -d)"
          cp -r out "$WORKDIR/dist"
          cp wrangler.jsonc "$WORKDIR/"

          cd "$WORKDIR"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "build: ${GITHUB_SHA:0:7} 的构建产物" \
            -m "源码提交: ${GITHUB_SHA}" \
            -m "workflow: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          # 每次都是全新的单提交孤儿分支，强制覆盖；main 不保留历史产物
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main
          rm -rf "$WORKDIR"
